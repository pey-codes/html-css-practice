<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Page</title>
<style>
    body {
        background-color: #f4f1ec;
        font-family: Arial, sans-serif;
        font-size: 18px;
    }
    h1 {
        color: teal;
        text-align: center;
    }
    h2 {
        color: teal;
        text-align: center;
    }
li {
    line-height: 1.8;
    color: #333333;
}
    p{
        text-align: center;
    }
    img {
        width: 200px;
        display: block;
        margin: 40px auto;
        border-radius: 12px;
    }
    ul {
        margin: 0 auto;
        list-style-position: inside;
    }
    a {
        color: teal;
    }
a:hover{
    color: crimson;
    text-decoration: none;
}
.card {
    background-color: white;
    padding: 24px;
    border-radius: 12px;
    max-width: 600px;
    margin: 20px auto;
    transition: 0.3s;
}
.card:hover {
    background-color: #fffdf8;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
}
</style>
</head>
<body>
<div class="card">
    <h1>Patience</h1>
    <img src="sunset.jpg" alt="Photo of Sunset">
    <p>I'm learning to code so I can build my own AI products and work with clients around the world.</p>
</div>
<div class="card">
    <h2>My goals</h2>
    <ul>
        <li>Become a skilled AI product builder</li>
        <li>Get international clients and earn in foreign currencies</li>
        <li>Build my own AI business and reach financial freedom</li>
    </ul>
</div>
    <p>See my code on <a href="https://github.com/pey-codes/learning-python">GitHub</a>.</p>
</body>
</html>
